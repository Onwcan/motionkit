name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  # A matrix rather than a single job: -Wconversion and -Wold-style-cast fire on
  # different constructs under GCC and Clang, and Release exercises optimiser
  # assumptions that Debug never reaches. Both compilers, both configurations.
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler == 'clang' && 'clang-18' || 'g++-14' }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        # -fno-sanitize-recover=all is set in the preset: a UBSan finding must
        # fail the build, not print a note and carry on.
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j "$(nproc)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }}

  benchmarks:
    name: benchmarks build and run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # An option nobody exercises stops working quietly. MOTIONKIT_BUILD_BENCHMARKS
      # spent its first months pointing add_subdirectory() at a directory that
      # was empty -- and therefore untracked, and therefore absent on a fresh
      # checkout -- so turning the option on failed at configure time.
      #
      # The numbers are not asserted on. A shared runner has no isolated cores
      # and no real-time scheduling, so a threshold here would be a flake
      # generator. This job proves the benchmark still builds and still runs to
      # completion; the figures in the README come from a known machine.
      - name: Configure with benchmarks on
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release             -DMOTIONKIT_BUILD_BENCHMARKS=ON -DMOTIONKIT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Run
        run: ./build/benchmarks/motionkit-bench

  static-analysis:
    name: clang-tidy + clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18 clang-format-18

      - name: Check formatting
        # Runs the same script a developer runs, so the two cannot drift.
        # The previous inline find/xargs searched a directory that was empty
        # -- and therefore untracked, and absent on a fresh checkout -- so it
        # failed even when every file was correctly formatted.
        run: bash scripts/format.sh --check
      - name: clang-tidy
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Only .cpp files under src/. A header has no entry in the compilation
          # database, so passing one to clang-tidy makes it fall back to a default
          # command and emit spurious diagnostics. Headers are still analysed
          # through the translation units that include them, via HeaderFilterRegex
          # in .clang-tidy. The fetched GoogleTest tree is excluded by construction.
          find src -name '*.cpp' \
            | xargs clang-tidy-18 -p build --warnings-as-errors='*'

  install-consumer:
    name: installed package is consumable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Exporting targets is easy to get subtly wrong in a way no unit test
      # catches: the library builds, and then find_package() fails for whoever
      # depends on it. This job installs the package and compiles a fresh
      # consumer against it, so that breakage shows up here instead of
      # downstream.
      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DMOTIONKIT_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/staged"
          cmake --build build -j "$(nproc)"
          cmake --install build

      - name: Compile a downstream consumer against the installed package
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOT'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES CXX)
          find_package(motionkit REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE motionkit::core)
          EOT
          cat > /tmp/consumer/main.cpp <<'EOT'
          #include <array>
          #include <cmath>
          #include "motionkit/core/frame_graph.hpp"
          #include "motionkit/core/trajectory.hpp"
          int main() {
            using namespace motionkit;
            const SE3 pose(SO3::rotZ(1.0), Vec3{1.0, 2.0, 3.0});
            if (!(pose.inverse() * pose).isApprox(SE3{}, 1e-12, 1e-12)) {
              return 1;
            }
            FrameGraph frames;
            const auto base = frames.declareRoot("base");
            if (!base) {
              return 2;
            }
            const auto tcp = frames.declareFrame("tcp", base.value, pose);
            if (!tcp) {
              return 3;
            }
            const auto resolved = frames.lookup(base.value, tcp.value);
            if (!resolved || !resolved.value.isApprox(pose, 1e-12, 1e-12)) {
              return 4;
            }
            // Every public header has to be reachable from the installed tree,
            // not just the one the first consumer happened to use.
            const std::array<Scalar, 2> here{0.0, 0.0};
            const std::array<Scalar, 2> there{1.0, 0.25};
            const std::array<MotionLimits, 2> limits{MotionLimits{2.0, 8.0, 40.0},
                                                     MotionLimits{2.0, 8.0, 40.0}};
            const auto move = SynchronizedTrajectory::plan(here, there, limits);
            if (!move || move.value.duration() <= 0.0) {
              return 5;
            }
            std::array<MotionSample, 2> setpoints{};
            if (!move.value.sample(move.value.duration(), setpoints)) {
              return 6;
            }
            if (std::abs(setpoints[1].position - 0.25) > 1e-12) {
              return 7;
            }
            // A free function rather than a member, so it exercises a different
            // part of the exported symbol set.
            const auto permitted = maximumSafeSpeed(0.3, limits[0]);
            if (!permitted || permitted.value <= 0.0) {
              return 8;
            }
            const auto stop =
                StopProfile::plan(MotionState{0.0, permitted.value, 0.0}, limits[0]);
            if (!stop || std::abs(stop.value.stoppingDistance() - 0.3) > 1e-9) {
              return 9;
            }
            return 0;
          }
          EOT
          cmake -S /tmp/consumer -B /tmp/consumer/build \
                -DCMAKE_PREFIX_PATH="$PWD/staged" -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer
